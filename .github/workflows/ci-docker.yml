name: CI (Docker)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore git_gltf_visualizer.sln -p:RuntimeIdentifier=

      - name: Build
        run: dotnet build git_gltf_visualizer.sln --configuration Release --no-restore -p:RuntimeIdentifier=

      - name: Test
        run: dotnet test git_gltf_visualizer.sln --configuration Release --no-build --verbosity normal -p:RuntimeIdentifier=
